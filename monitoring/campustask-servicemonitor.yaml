
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: campustask-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - campustask
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

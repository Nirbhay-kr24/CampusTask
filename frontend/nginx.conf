server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; }
 location /health { proxy_pass http://backend:8000/health; }
 location /ready { proxy_pass http://backend:8000/ready; }
 location /metrics { proxy_pass http://backend:8000/metrics; }
}

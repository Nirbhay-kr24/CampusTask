name: Campustask CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -v -p no:cacheprovider

  # 2. SAST - CodeQL
  sast-codeql:
    name: SAST - CodeQL
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 3. Docker Build
  docker-build:
    name: Docker Build
    needs: [unit-tests, sast-codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          no-cache: true
          tags: campustask-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          no-cache: true
          tags: campustask-frontend:ci

      - name: Save backend image to artifact
        run: |
          mkdir -p /tmp/images
          docker save -o /tmp/images/backend.tar campustask-backend:ci

      - name: Save frontend image to artifact
        run: |
          mkdir -p /tmp/images
          docker save -o /tmp/images/frontend.tar campustask-frontend:ci

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/images/backend.tar
          retention-days: 1

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/images/frontend.tar
          retention-days: 1

      - name: Verify Starlette version in backend image
        run: |
            docker run --rm campustask-backend:ci python - <<'PY'
            try:
                import starlette
                print("backend starlette==" + starlette.__version__)
            except Exception as e:
                print("backend starlette not installed:", e)
            PY

      - name: Verify Starlette version in frontend image
        run: |
            docker run --rm --entrypoint python campustask-frontend:ci - <<'PY' || echo "frontend: python or starlette not present"
            try:
                import starlette
                print("frontend starlette==" + starlette.__version__)
            except Exception as e:
                print("frontend starlette not installed:", e)
            PY     

          

  # 4. Image Scan - Trivy
  image-scan:
    name: Image Scan - Trivy
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp/images

      - name: Download frontend image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp/images

      - name: Load backend image
        run: docker load -i /tmp/images/backend.tar

      - name: Load frontend image
        run: docker load -i /tmp/images/frontend.tar

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: campustask-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: campustask-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # 5. Push Image to Docker Hub
  push-docker-hub:
    name: Push Image to Docker Hub
    needs: image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            nirbhaykr24/campustask-backend:latest
            nirbhaykr24/campustask-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            nirbhaykr24/campustask-frontend:latest
            nirbhaykr24/campustask-frontend:${{ github.sha }}

